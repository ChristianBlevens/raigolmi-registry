# The fallback a face with no desktop/ of its own gets. A face that ships one replaces
# this wholesale, because faces.py mounts its directory over /etc/face.
#
# Deliberately almost nothing: a face is defined by its own config (§4.3), and a default
# that imposed a layout would be this image quietly deciding what every face looks like.
output * bg #202430 solid_color
default_border none
font pango:DejaVu Sans 10

set $mod Mod4
# A terminal's shell is the focused toolbelt's (§4.8); the window is the face's.
bindsym $mod+Return exec foot python3 -m rai terminal
bindsym $mod+q kill
