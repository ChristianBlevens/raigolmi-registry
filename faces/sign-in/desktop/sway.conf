# Sign-in Browser (LAYER.md): Firefox filling the screen and nothing else. Super alone and
# Super+` are the host's (/guide/faces.md), so the face binds no keys.
output * bg #202430 solid_color
default_border none
default_floating_border pixel 1
gaps inner 0
gaps outer 0
font pango:DejaVu Sans 10
focus_follows_mouse no
focus_on_window_activation focus

exec /etc/face/start
